name: Feature Workflow
on:
  pull_request:
    paths:
      - '**'
  push:
    branches:
      - 'feature/**'

jobs:
  build:
    name: Build Image and Deploy
    environment: dev
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      IMAGE_URL: ${{ vars.GCP_IMAGE_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_IMAGE_REGISTRY_NAME }}/${{ vars.PIPELINE_NAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker to use gcloud as a credential helper
        run: gcloud auth configure-docker ${{ vars.GCP_IMAGE_REGISTRY_HOST }}

      - name: Build Image
        run: |
          docker build -t ${{ env.IMAGE_URL }}:${{ env.IMAGE_TAG }} .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URL }}:${{ env.IMAGE_TAG }}
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Push Image
        run: docker push ${{ env.IMAGE_URL }}:${{ env.IMAGE_TAG }}

      - name: Trigger deployment
        run: |
          ./trigger_deployment.sh \
            "${{ secrets.PAT }}" \
            "${{ vars.DEPLOYMENT_WORKFLOW_REPO }}" \
            "${{ vars.DEPLOYMENT_WORKFLOW_NAME }}" \
            "${{ vars.PIPELINE_NAME }}" \
            "${{ github.ref }}" \
            "${{ env.IMAGE_URL }}:${{ env.IMAGE_TAG }}"
